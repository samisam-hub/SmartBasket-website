<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Haushalt anlegen</title>
</head>
<body>
<x-dc>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 32px; display: flex; flex-direction: column; gap: 24px; background: #FFFCF8; color: #362B26; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: #AD5137">EINMAL EINRICHTEN</div>
<h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 700">Wer isst bei euch mit?</h1>
<p style="margin: 0; font-size: 16px; line-height: 24px; color: #75665D">Lege an, für wen du planst. Erwachsene und Kinder bekommen passende Portionen.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{people}}" as="p" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 10px 12px 10px 14px; box-sizing: border-box; border-radius: 16px; background: #FFFFFF; border: 1.5px solid #EADFD6">
<span style="{{p.avatar}}">{{p.initial}}</span>
<span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
<span style="font-size: 17px; font-weight: 600">{{p.name}}</span>
<span style="font-size: 13px; color: #75665D; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{p.portion}}</span>
</span>
<button onClick="{{p.toggle}}" aria-label="{{p.toggleLabel}}" style="{{p.chip}}">{{p.kind}}</button>
<button onClick="{{p.remove}}" aria-label="{{p.removeLabel}}" style="display: {{p.removeDisplay}}; align-items: center; justify-content: center; width: 36px; height: 36px; flex-shrink: 0; border-radius: 999px; border: none; background: #F3EAE2; color: #75665D; font: inherit; font-size: 18px; cursor: pointer">×</button>
</div>
</sc-for>
<button onClick="{{add}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; border-radius: 16px; border: 1.5px dashed #D9CCC2; background: none; color: #AD5137; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">+ Person hinzufügen</button>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: #FCEEDD">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#AD5137" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20a6 6 0 0 1 12 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a5 5 0 0 1 3 6"></path></svg>
<span style="font-size: 15px; line-height: 22px">{{summary}}</span>
</div>
<div style="flex-grow: 1"></div>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #75665D; text-align: center">Jederzeit im Profil änderbar</p>
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #AD5137; color: #FFFFFF; font-size: 17px; font-weight: 600; text-decoration: none">Weiter</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const st = this.props.store, people = st.data.people;
const adults = people.filter(p => !p.kid).length, kids = people.length - adults;
const tints = ['#F4D8BF', '#E8DCCB', '#FCEEDD', '#EADFD6'];
const parts = [];
if (adults) parts.push(adults + (adults === 1 ? ' erwachsene Person' : ' Erwachsene'));
if (kids) parts.push(kids + (kids === 1 ? ' Kind' : ' Kinder'));
const save = list => st.set({ people: list });
return {
summary: people.length ? parts.join(' und ') + ' · alle Mengen werden dafür berechnet.' : 'Noch niemand angelegt.',
add: () => save(people.concat([{ name: 'Person ' + (people.length + 1), kid: false }])),
people: people.map((p, i) => ({
name: p.name, initial: p.name.charAt(0), kind: p.kid ? 'Kind' : 'Erwachsen',
portion: p.kid ? 'kleine Portion' : 'große Portion',
toggleLabel: p.name + ': ' + (p.kid ? 'als erwachsen markieren' : 'als Kind markieren'),
removeLabel: p.name + ' entfernen', removeDisplay: people.length > 1 ? 'flex' : 'none',
toggle: () => save(people.map((q, j) => j === i ? { name: q.name, kid: !q.kid } : q)),
remove: () => save(people.filter((_, j) => j !== i)),
avatar: 'display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; font-size: 18px; font-weight: 700; color: #362B26; background: ' + tints[i % tints.length],
chip: 'min-height: 36px; padding: 0 12px; flex-shrink: 0; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; ' + (p.kid ? 'background: #FCEEDD; color: #AD5137; border: 1.5px solid #F4D8BF' : 'background: #FFFFFF; color: #362B26; border: 1.5px solid #EADFD6')
}))
};
}
}
</script>
</body>
</html>
