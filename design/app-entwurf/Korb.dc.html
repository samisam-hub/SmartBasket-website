<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Einkaufskorb</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 48px 20px 28px; display: flex; flex-direction: column; gap: 12px; background: #FFFCF8; color: #362B26; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 0 4px">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: #AD5137">{{range}}</div>
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700">Dein Einkauf</h1>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #75665D">{{subtitle}}</p>
</div>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #EADFD6">
<span style="font-size: 16px; font-weight: 600">Noch keine Gerichte gewählt</span>
<span style="font-size: 14px; line-height: 20px; color: #75665D">Erstelle zuerst deinen Wochenplan, dann erscheinen hier die Zutaten.</span>
<a href="Geschmack.dc.html" style="align-self: flex-start; min-height: 40px; display: flex; align-items: center; color: #AD5137; font-size: 15px; font-weight: 600; text-decoration: none">Zum Geschmack</a>
</div>
</sc-if>
<sc-if value="{{hasItems}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; border-radius: 16px; background: #FFFFFF; border: 1px solid #EADFD6; overflow: hidden">
<sc-for list="{{items}}" as="item" hint-placeholder-count="4">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 4px 14px; box-sizing: border-box; border-bottom: 1px solid #F3EAE2">
<span style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
<span style="font-size: 15px; font-weight: 600">{{item.name}}</span>
<span style="font-size: 12px; color: #75665D; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">für {{item.for}}</span>
</span>
<span style="font-size: 13px; color: #75665D; flex-shrink: 0">{{item.qty}}</span>
</div>
</sc-for>
<sc-if value="{{hasMore}}" hint-placeholder-val="{{ true }}">
<button onClick="{{toggleMore}}" style="min-height: 42px; border: none; background: #FFFFFF; color: #AD5137; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{moreLabel}}</button>
</sc-if>
</div>
</sc-if>
<sc-if value="{{ready}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #EADFD6">
<span style="width: 10px; height: 10px; border-radius: 999px; background: #E8B386; flex-shrink: 0"></span>
<span style="font-size: 14px; line-height: 20px">{{readyText}}</span>
</div>
</sc-if>
<sc-if value="{{baking}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-radius: 14px; background: #FCEEDD">
<span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 600">Kuchen backen</span><span style="font-size: 12px; color: #75665D">Mehl · Zucker · Butter · Eier</span></span>
<span style="font-size: 13px; color: #75665D">4 Zutaten</span>
</div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #EADFD6">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 1px; color: #75665D">IMMER DABEI</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{regulars}}" as="r" hint-placeholder-count="5">
<button onClick="{{r.toggle}}" aria-pressed="{{r.pressed}}" style="{{r.style}}">{{r.label}}</button>
</sc-for>
</div>
</div>
<div style="flex-grow: 1"></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-if value="{{hasNote}}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 12px; background: #FCEEDD; font-size: 13px; line-height: 18px"><span style="color: #AD5137; font-weight: 700">✓</span>{{note}}</div>
</sc-if>
<button onClick="{{order}}" style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 22px; border: none; border-radius: 999px; background: #AD5137; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer">
<span>Jetzt bestellen</span><span style="font-size: 14px; font-weight: 500; opacity: .85">{{total}} Artikel · {{extraCount}}</span>
</button>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button onClick="{{download}}" style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 46px; border-radius: 999px; border: 1.5px solid #EADFD6; background: #FFFFFF; color: #362B26; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#362B26" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"></path><path d="M7 10l5 5 5-5"></path><path d="M5 20h14"></path></svg>Liste herunterladen</button>
<button onClick="{{save}}" aria-pressed="{{savedPressed}}" style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 46px; border-radius: 999px; border: 1.5px solid #EADFD6; background: #FFFFFF; color: #362B26; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#362B26" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v16l-6-4-6 4z"></path></svg>{{saveLabel}}</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const st = this.props.store, lib = this.props.lib, data = st.data;
const on = data.extras, b = lib.basket(), people = lib.eaters();
const days = lib.selectedDays().filter(d => data.plan[d] && Object.keys(data.plan[d]).length);
const defs = [{ id: 'juice', label: 'Apfelsaft' }, { id: 'milk', label: 'Milch' }, { id: 'coffee', label: 'Kaffee' }, { id: 'bread', label: 'Brot' }, { id: 'cheese', label: 'Käse' }];
const n = defs.filter(d => on[d.id]).length, more = !!this.state.more, limit = 6;
const pp = [];
if (people.adults) pp.push(people.adults + (people.adults === 1 ? ' Erwachsene Person' : ' Erwachsene').replace('Erwachsene Person', 'erwachsene Person'));
if (people.kids) pp.push(people.kids + (people.kids === 1 ? ' Kind' : ' Kinder'));
const range = days.length ? days.map(d => lib.SHORT[d]).join(', ').toUpperCase() + ' · OKTOBER' : 'NOCH NICHTS GEPLANT';
return {
range: range,
subtitle: 'Mengen für ' + pp.join(' und ') + (data.events.bake ? ' · plus Backen' : ''),
empty: b.items.length === 0 && b.ready === 0,
hasItems: b.items.length > 0,
items: more ? b.items : b.items.slice(0, limit),
hasMore: b.items.length > limit,
moreLabel: more ? 'Weniger anzeigen' : (b.items.length - limit) + ' weitere Zutaten anzeigen',
toggleMore: () => this.setState({ more: !more }),
ready: b.ready > 0, readyText: b.ready + (b.ready === 1 ? ' Fertiggericht zum Aufwärmen' : ' Fertiggerichte zum Aufwärmen'),
baking: !!data.events.bake,
extraCount: n === 0 ? 'ohne Extras' : n + (n === 1 ? ' Extra' : ' Extras'),
total: b.items.length + (b.ready ? 1 : 0) + (data.events.bake ? 4 : 0) + n,
hasNote: !!this.state.note, note: this.state.note || '',
order: () => this.setState({ note: 'Im Entwurf angedeutet: Hier übergibst du den Korb später an einen Händler zum Bestellen.' }),
download: () => {
const lines = ['SmartBasket – Einkaufsliste', 'Tage: ' + days.map(d => lib.DAY_NAMES[d]).join(', '), ''];
b.items.forEach(it => lines.push('[ ] ' + it.name + ' – ' + it.qty));
if (b.ready) lines.push('[ ] ' + b.ready + ' Fertiggericht(e) zum Aufwärmen');
if (data.events.bake) ['Mehl', 'Zucker', 'Butter', 'Eier'].forEach(x => lines.push('[ ] ' + x + ' (Backen)'));
defs.filter(d => on[d.id]).forEach(d => lines.push('[ ] ' + d.label));
try { const url = URL.createObjectURL(new Blob([lines.join('\n') + '\n'], { type: 'text/plain;charset=utf-8' }));
const a = document.createElement('a'); a.href = url; a.download = 'smartbasket-einkaufsliste.txt'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000); } catch (e) {}
this.setState({ note: 'Einkaufsliste heruntergeladen.' }); },
save: () => this.setState({ saved: true, note: 'Korb gespeichert. Im Entwurf nur angedeutet.' }),
saveLabel: this.state.saved ? 'Gespeichert' : 'Korb speichern', savedPressed: this.state.saved ? 'true' : 'false',
regulars: defs.map(d => { const active = !!on[d.id];
return { label: (active ? '✓ ' : '+ ') + d.label, pressed: active ? 'true' : 'false',
toggle: () => st.set({ extras: Object.assign({}, on, { [d.id]: !active }) }),
style: 'min-height: 38px; padding: 0 14px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; ' + (active ? 'background: #AD5137; color: #FFFFFF; border: 1.5px solid #AD5137; font-weight: 600' : 'background: #FFFFFF; color: #362B26; border: 1.5px solid #EADFD6') }; })
};
}
}
</script>
</body>
</html>
