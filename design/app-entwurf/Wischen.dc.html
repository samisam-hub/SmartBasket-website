<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Gericht wählen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#AD5137}a:hover{color:#8A3F2A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 32px; display: flex; flex-direction: column; gap: 20px; background: #FFFCF8; color: #362B26; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: #AD5137">MONTAG · 1 VON 3</div>
<h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 700">Was gibt es zum Frühstück?</h1>
</div>
<div style="display: flex; gap: 8px">
<span style="padding: 6px 12px; border-radius: 999px; background: #362B26; color: #FFFFFF; font-size: 13px; font-weight: 600">Frühstück</span>
<span style="padding: 6px 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #EADFD6; color: #75665D; font-size: 13px">Mittag</span>
<span style="padding: 6px 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #EADFD6; color: #75665D; font-size: 13px">Abend</span>
</div>
<div style="display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{dishes}}" as="dish" hint-placeholder-count="2">
<button onClick="{{dish.pick}}" style="{{dish.style}}">
<span style="{{dish.photo}}">
<img src="{{dish.img}}" alt="{{dish.name}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<span style="{{dish.badge}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
</span>
</span>
<span style="display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; text-align: left">
<span style="font-size: 17px; font-weight: 600; color: #362B26">{{dish.name}}</span>
<span style="font-size: 14px; color: #75665D">{{dish.parts}}</span>
</span>
</button>
</sc-for>
</div>
<a href="#" style="align-self: center; display: flex; align-items: center; gap: 6px; min-height: 44px; font-size: 15px; font-weight: 600; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"></path></svg>
Zwei andere zeigen
</a>
<div style="flex-grow: 1"></div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; color: #75665D; text-align: center">Oder heute nicht kochen</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button style="height: 48px; border-radius: 12px; border: 1.5px solid #EADFD6; background: #FFFFFF; color: #362B26; font: inherit; font-size: 14px; font-weight: 600">Überspringen</button>
<button style="height: 48px; border-radius: 12px; border: 1.5px solid #EADFD6; background: #FFFFFF; color: #362B26; font: inherit; font-size: 14px; font-weight: 600">Aufwärmen</button>
<button style="height: 48px; border-radius: 12px; border: 1.5px solid #EADFD6; background: #FFFFFF; color: #362B26; font: inherit; font-size: 14px; font-weight: 600">Auswärts</button>
</div>
</div>
<a href="TagFertig.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #AD5137; color: #FFFFFF; font-size: 17px; font-weight: 600; text-decoration: none">Weiter zum Mittagessen</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { picked: 'oats' };
}
renderVals() {
const list = [
{ id: 'oats', name: 'Haferbrei mit Beeren', parts: 'Haferflocken · Beeren · Banane', tint: '#F4D8BF', img: '/_blob/9bc8692cf3631aa3d17458f7d18d2838' },
{ id: 'toast', name: 'Ei-Toast mit Hähnchenschinken', parts: 'Eier · Brot · Hähnchenschinken', tint: '#E8DCCB', img: '/_blob/2c0ba3c590f91304b33340ac8f682c2c' }
];
const picked = this.state.picked;
return {
dishes: list.map(d => {
const on = picked === d.id;
return {
name: d.name,
parts: d.parts,
img: d.img,
pick: () => this.setState({ picked: d.id }),
style: 'display: flex; flex-direction: column; padding: 0; overflow: hidden; border-radius: 20px; cursor: pointer; font: inherit; background: #FFFFFF; ' + (on ? 'border: 2.5px solid #AD5137' : 'border: 1.5px solid #EADFD6; opacity: 0.75'),
photo: 'position: relative; display: flex; align-items: center; justify-content: center; height: 124px; overflow: hidden; background: ' + d.tint,
badge: 'position: absolute; top: 10px; right: 10px; display: ' + (on ? 'flex' : 'none') + '; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 999px; background: #AD5137'
};
})
};
}
}
</script>
</body>
</html>
