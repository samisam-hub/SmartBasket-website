<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Mahlzeit tauschen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 52px 24px 28px; display: flex; flex-direction: column; gap: 14px; background: #FFFCF8; color: #362B26; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: #AD5137">{{eyebrow}}</div>
<h1 style="margin: 0; font-size: 26px; line-height: 32px; font-weight: 700">Mahlzeit tauschen</h1>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #75665D">Aktuell: {{currentText}}</p>
</div>
<div style="display: flex; gap: 6px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; overflow: hidden">
<sc-for list="{{dishes}}" as="dish" hint-placeholder-count="3">
<button onClick="{{dish.pick}}" aria-pressed="{{dish.pressed}}" style="{{dish.style}}">
<span style="{{dish.photo}}"><img src="{{dish.img}}" alt="" style="{{dish.imgStyle}}"></span>
<span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; text-align: left">
<span style="font-size: 15px; font-weight: 600; color: #362B26">{{dish.name}}</span>
<span style="font-size: 12px; color: #75665D">{{dish.meta}}</span>
</span>
<span style="{{dish.badge}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
</button>
</sc-for>
</div>
<div style="flex-grow: 1"></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; color: #75665D; text-align: center">Oder nicht kochen</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
<button onClick="{{m.pick}}" aria-pressed="{{m.pressed}}" style="{{m.style}}">{{m.label}}</button>
</sc-for>
</div>
</div>
<a href="Wochenplan.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border: none; border-radius: 999px; background: #AD5137; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 600; text-decoration: none; cursor: pointer">Zurück zum Plan</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const st = this.props.store, lib = this.props.lib, data = st.data;
const days = lib.selectedDays(), meals = lib.mealsFor();
const target = data.edit && days.indexOf(data.edit.day) >= 0 && meals.some(m => m.id === data.edit.slot) ? data.edit : { day: days[0] === undefined ? 0 : days[0], slot: (meals[0] || lib.SLOTS[0]).id };
const slot = lib.SLOTS.filter(s => s.id === target.slot)[0], dayPlan = data.plan[target.day] || {}, entry = dayPlan[slot.id];
const decide = e => { const plan = Object.assign({}, data.plan); const dp = Object.assign({}, dayPlan); dp[slot.id] = Object.assign(e, { auto: false }); plan[target.day] = dp; st.set({ plan: plan }); };
return {
eyebrow: lib.DAY_NAMES[target.day].toUpperCase() + ' · ' + slot.label.toUpperCase(),
currentText: lib.entryText(entry),
tabs: meals.map(m => { const on = m.id === slot.id; return { label: m.short, pressed: on ? 'true' : 'false', pick: () => st.set({ edit: { day: target.day, slot: m.id }, hintSeen: true }),
style: 'flex: 1; height: 38px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #362B26; color: #FFFFFF; border: 1.5px solid #362B26' : 'background: #FFFFFF; color: #362B26; border: 1.5px solid #EADFD6') }; }),
dishes: lib.candidates(slot.id).map(id => {
const dish = lib.DISHES[id], on = !!entry && entry.kind === 'cook' && entry.dish === id, liked = data.prefs[id] === true, disliked = data.prefs[id] === false;
return { name: dish.name, img: dish.img || '', pressed: on ? 'true' : 'false',
meta: (liked ? '♥ gemerkt · ' : disliked ? 'nicht gemocht · ' : '') + dish.parts,
pick: () => decide({ kind: 'cook', dish: id }),
style: 'display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 8px; border-radius: 16px; cursor: pointer; font: inherit; background: #FFFFFF; ' + (on ? 'border: 2px solid #AD5137' : 'border: 1.5px solid #EADFD6'),
photo: 'position: relative; display: block; width: 56px; height: 56px; flex-shrink: 0; overflow: hidden; border-radius: 12px; background: #F4D8BF',
imgStyle: 'position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: ' + (dish.img ? 'block' : 'none'),
badge: 'display: ' + (on ? 'flex' : 'none') + '; align-items: center; justify-content: center; width: 24px; height: 24px; flex-shrink: 0; border-radius: 999px; background: #AD5137' };
}),
modes: [['skip', 'Überspringen'], ['heat', 'Aufwärmen'], ['out', 'Auswärts']].map(m => {
const on = !!entry && entry.kind === m[0];
return { label: m[1], pressed: on ? 'true' : 'false', pick: () => decide({ kind: m[0] }),
style: 'height: 46px; border-radius: 12px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #362B26; color: #FFFFFF; border: 1.5px solid #362B26' : 'background: #FFFFFF; color: #362B26; border: 1.5px solid #EADFD6') };
})
};
}
}
</script>
</body>
</html>
