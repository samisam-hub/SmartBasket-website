<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Tag fertig</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#AD5137}a:hover{color:#8A3F2A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 32px; display: flex; flex-direction: column; gap: 18px; background: #FFFCF8; color: #362B26; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif">
<div style="display: flex; align-items: center; gap: 14px; padding: 0 4px">
<span style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; flex-shrink: 0; border-radius: 999px; background: #AD5137">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
</span>
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 24px; line-height: 30px; font-weight: 700">{{headline}}</span>
<span style="font-size: 15px; color: #75665D">{{remaining}}</span>
</span>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{week}}" as="d" hint-placeholder-count="7">
<span style="{{d.style}}">
<span style="font-size: 12px; font-weight: 600">{{d.short}}</span>
<span style="font-size: 17px; font-weight: 700">{{d.date}}</span>
<span style="{{d.mark}}"></span>
</span>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 16px; background: #FFFFFF; border: 1.5px solid #AD5137">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #AD5137">MONTAG</span>
<span style="display: flex; align-items: center; gap: 8px; font-size: 15px"><span style="width: 8px; height: 8px; border-radius: 999px; background: #AD5137"></span>Haferbrei mit Beeren</span>
<span style="display: flex; align-items: center; gap: 8px; font-size: 15px"><span style="width: 8px; height: 8px; border-radius: 999px; background: #E8B386"></span>Pasta · aufwärmen</span>
<span style="display: flex; align-items: center; gap: 8px; font-size: 15px"><span style="width: 8px; height: 8px; border-radius: 999px; border: 1.5px solid #75665D; box-sizing: border-box"></span>Auswärts essen</span>
</div>
<sc-if value="{{copied}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 16px; background: #FCEEDD">
<span style="font-size: 15px; font-weight: 600">Dienstag übernommen</span>
<span style="font-size: 14px; line-height: 20px; color: #75665D">Gleiche Gerichte und Modi wie Montag. Einzelne Mahlzeiten tauschst du im Kalender mit einem Tipp.</span>
<button onClick="{{undo}}" style="align-self: flex-start; min-height: 44px; padding: 0; border: none; background: none; color: #AD5137; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Rückgängig</button>
</div>
</sc-if>
<div style="flex-grow: 1"></div>
<div style="display: flex; flex-direction: column; gap: 10px">
<a href="Tag.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #AD5137; color: #FFFFFF; font-size: 17px; font-weight: 600; text-decoration: none">{{nextLabel}}</a>
<sc-if value="{{canCopy}}" hint-placeholder-val="{{ true }}">
<button onClick="{{copy}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 999px; border: 1.5px solid #AD5137; background: #FFFFFF; color: #AD5137; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V6a2 2 0 0 1 2-2h9"></path></svg>
Dienstag wie Montag
</button>
</sc-if>
<a href="Wochenplan.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; font-size: 15px; font-weight: 600; text-decoration: none">Später weitermachen</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { copied: false };
}
renderVals() {
const copied = this.state.copied;
const names = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
const done = copied ? [0, 1] : [0];
const chosen = [0, 1, 2, 3];
const week = names.map((n, i) => {
const isDone = done.includes(i);
const isChosen = chosen.includes(i);
const base = 'display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; border-radius: 12px; ';
const style = isDone ? base + 'background: #AD5137; color: #FFFFFF' : isChosen ? base + 'background: #FFFFFF; color: #362B26; border: 1.5px solid #AD5137' : base + 'background: #FFFCF8; color: #B3A69C; border: 1px solid #EADFD6';
const mark = 'width: 6px; height: 6px; border-radius: 999px; background: ' + (isDone ? '#FFFFFF' : isChosen ? '#E8B386' : 'transparent');
return { short: n, date: String(5 + i), style, mark };
});
const open = chosen.filter(i => !done.includes(i)).map(i => names[i]);
return {
week,
copied,
canCopy: !copied,
headline: copied ? 'Mo und Di stehen' : 'Montag ist geplant',
remaining: 'Nur noch ' + open.join(' und ').replace(/ und (?=.* und )/g, ', '),
nextLabel: 'Weiter mit ' + (copied ? 'Mittwoch' : 'Dienstag'),
copy: () => this.setState({ copied: true }),
undo: () => this.setState({ copied: false })
};
}
}
</script>
</body>
</html>
