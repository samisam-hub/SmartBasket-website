<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Tag fertig</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 32px; display: flex; flex-direction: column; gap: 18px; background: #FFFCF8; color: #362B26; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif">
<div style="display: flex; align-items: center; gap: 14px; padding: 0 4px">
<span style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; flex-shrink: 0; border-radius: 999px; background: #AD5137">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
</span>
<span style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 700">{{headline}}</h1>
<span style="font-size: 15px; color: #75665D">{{remaining}}</span>
</span>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{week}}" as="d" hint-placeholder-count="7">
<span style="{{d.style}}">
<span style="font-size: 12px; font-weight: 600">{{d.short}}</span>
<span style="font-size: 17px; font-weight: 700">{{d.date}}</span>
<span style="{{d.mark}}"></span>
</span>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 16px; background: #FFFFFF; border: 1.5px solid #AD5137">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #AD5137">{{dayLabel}} · GESPEICHERT</span>
<sc-for list="{{entries}}" as="e" hint-placeholder-count="3">
<span style="display: flex; align-items: center; gap: 8px; font-size: 15px"><span style="width: 66px; flex-shrink: 0; font-size: 12px; color: #75665D">{{e.slot}}</span><span style="{{e.dot}}"></span><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{e.text}}</span></span>
</sc-for>
</div>
<sc-if value="{{copied}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 16px; background: #FCEEDD">
<span style="font-size: 15px; font-weight: 600">{{copiedTitle}}</span>
<span style="font-size: 14px; line-height: 20px; color: #75665D">Gleiche Gerichte und Modi. Einzelne Mahlzeiten tauschst du im Kalender mit einem Tipp.</span>
<button onClick="{{undo}}" style="align-self: flex-start; min-height: 40px; padding: 0; border: none; background: none; color: #AD5137; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Rückgängig</button>
</div>
</sc-if>
<div style="flex-grow: 1"></div>
<div style="display: flex; flex-direction: column; gap: 10px">
<button onClick="{{next}}" style="display: flex; align-items: center; justify-content: center; height: 56px; border: none; border-radius: 999px; background: #AD5137; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer">{{nextLabel}}</button>
<sc-if value="{{canCopy}}" hint-placeholder-val="{{ true }}">
<button onClick="{{copy}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 999px; border: 1.5px solid #AD5137; background: #FFFFFF; color: #AD5137; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V6a2 2 0 0 1 2-2h9"></path></svg>
{{copyLabel}}
</button>
</sc-if>
<a href="Wochenplan.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; color: #AD5137; font-size: 15px; font-weight: 600; text-decoration: none">Zum Wochenkalender</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const st = this.props.store, lib = this.props.lib, data = st.data;
const days = lib.selectedDays(), pos = Math.min(data.dayPos, Math.max(days.length - 1, 0)), day = days[pos] === undefined ? 0 : days[pos];
const nextDay = days[pos + 1], copiedTo = this.state.copiedTo;
const plan = data.plan[day] || {};
const dot = { cook: '#AD5137', heat: '#E8B386', out: 'transparent', skip: '#EADFD6' };
const doneDays = days.filter(d => lib.dayDone(d));
const open = days.filter(d => !lib.dayDone(d)).map(d => lib.SHORT[d]);
const listText = arr => arr.length <= 1 ? arr.join('') : arr.slice(0, -1).join(', ') + ' und ' + arr[arr.length - 1];
return {
dayLabel: lib.DAY_NAMES[day].toUpperCase(),
headline: lib.dayDone(day) ? (copiedTo !== undefined ? lib.SHORT[day] + ' und ' + lib.SHORT[copiedTo] + ' stehen' : lib.DAY_NAMES[day] + ' ist geplant') : lib.DAY_NAMES[day] + ' ist noch offen',
remaining: open.length ? 'Noch offen: ' + listText(open) : 'Alle gewählten Tage sind geplant',
entries: lib.mealsFor(day).map(s => { const e = plan[s.id]; const k = e ? e.kind : 'skip';
return { slot: s.short, text: lib.entryText(e), dot: 'width: 8px; height: 8px; flex-shrink: 0; border-radius: 999px; box-sizing: border-box; background: ' + dot[k] + (k === 'out' ? '; border: 1.5px solid #75665D' : '') }; }),
week: lib.SHORT.map((n, i) => {
const isDone = lib.dayDone(i), isChosen = days.indexOf(i) >= 0;
const base = 'display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; border-radius: 12px; ';
return { short: n, date: String(5 + i),
style: isDone ? base + 'background: #AD5137; color: #FFFFFF' : isChosen ? base + 'background: #FFFFFF; color: #362B26; border: 1.5px solid #AD5137' : base + 'background: #FFFCF8; color: #B3A69C; border: 1px solid #EADFD6',
mark: 'width: 6px; height: 6px; border-radius: 999px; background: ' + (isDone ? '#FFFFFF' : isChosen ? '#E8B386' : 'transparent') };
}),
copied: copiedTo !== undefined, copiedTitle: copiedTo !== undefined ? lib.DAY_NAMES[copiedTo] + ' übernommen' : '',
canCopy: nextDay !== undefined && copiedTo === undefined && lib.dayDone(day),
copyLabel: nextDay !== undefined ? lib.DAY_NAMES[nextDay] + ' wie ' + lib.DAY_NAMES[day] : '',
copy: () => {
const p = Object.assign({}, data.plan); p[nextDay] = JSON.parse(JSON.stringify(plan));
const m = Object.assign({}, data.dayMeals); m[nextDay] = Object.assign({}, data.dayMeals[day] || data.standard);
this.state.copiedTo = nextDay; st.set({ plan: p, dayMeals: m });
},
undo: () => { const p = Object.assign({}, data.plan); delete p[copiedTo]; this.state.copiedTo = undefined; st.set({ plan: p }); },
nextLabel: (function () { const after = days.slice(pos + 1).filter(d => !lib.dayDone(d))[0]; return after !== undefined ? 'Weiter mit ' + lib.DAY_NAMES[after] : 'Einkaufskorb erstellen'; })(),
next: () => {
const after = days.slice(pos + 1).filter(d => !lib.dayDone(d))[0];
this.state.copiedTo = undefined;
if (after !== undefined) { st.set({ dayPos: days.indexOf(after), slotPos: 0 }); this.props.go('Tag'); } else this.props.go('Korb');
}
};
}
}
</script>
</body>
</html>
