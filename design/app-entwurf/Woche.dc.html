<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Woche wählen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#AD5137}a:hover{color:#8A3F2A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 32px; display: flex; flex-direction: column; gap: 28px; background: #FFFCF8; color: #362B26; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: #AD5137">KW 41 · 5.–11. OKTOBER</div>
<h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 700">Was steht diese Woche an?</h1>
<p style="margin: 0; font-size: 16px; line-height: 24px; color: #75665D">Tippe die Tage an, die du planen willst.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{days}}" as="day" hint-placeholder-count="7">
<button onClick="{{day.toggle}}" style="{{day.style}}">
<span style="font-size: 14px; font-weight: 600">{{day.short}}</span>
<span style="font-size: 24px; font-weight: 700">{{day.date}}</span>
</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: #FCEEDD">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#AD5137" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
<span style="font-size: 15px; line-height: 22px">{{summary}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<span style="font-size: 17px; font-weight: 600">Steht etwas Besonderes an?</span>
<span style="font-size: 13px; color: #75665D">optional</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{events}}" as="ev" hint-placeholder-count="4">
<button onClick="{{ev.toggle}}" style="{{ev.style}}">{{ev.label}}</button>
</sc-for>
<button style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px dashed #D9CCC2; background: none; color: #75665D; font: inherit; font-size: 15px; cursor: pointer">+ Eigenes</button>
</div>
<sc-if value="{{baking}}" hint-placeholder-val="{{ true }}">
<span style="font-size: 14px; line-height: 20px; color: #75665D">Du wählst gleich ein Backrezept. Die Zutaten kommen mit in den Korb.</span>
</sc-if>
</div>
<div style="flex-grow: 1"></div>
<button onClick="{{start}}" style="display: flex; align-items: center; justify-content: center; height: 56px; border: none; border-radius: 999px; background: #AD5137; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer">Weiter zum Geschmack</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const st = this.props.store, lib = this.props.lib, data = st.data;
const ev = data.events, picked = data.days;
const count = picked.length;
const evDefs = [{ id: 'bake', label: 'Backen' }, { id: 'guests', label: 'Besuch' }, { id: 'party', label: 'Geburtstag' }];
return {
baking: !!ev.bake,
events: evDefs.map(e => {
const on = !!ev[e.id];
return {
label: e.label,
toggle: () => st.set({ events: Object.assign({}, ev, { [e.id]: !on }) }),
style: 'min-height: 44px; padding: 0 16px; border-radius: 999px; font: inherit; font-size: 15px; cursor: pointer; ' + (on ? 'background: #362B26; color: #FFFFFF; border: 1.5px solid #362B26; font-weight: 600' : 'background: #FFFFFF; color: #362B26; border: 1.5px solid #EADFD6')
};
}),
summary: count === 0 ? 'Noch kein Tag ausgewählt' : count + (count === 1 ? ' Tag' : ' Tage') + ' ausgewählt · der Rest bleibt frei',
start: () => { st.set({ swipePos: 0 }); this.props.go('Geschmack'); },
days: lib.SHORT.map((n, i) => {
const on = picked.indexOf(i) >= 0;
return {
short: n, date: String(5 + i),
toggle: () => st.set({ days: on ? picked.filter(x => x !== i) : picked.concat([i]), generated: false }),
style: 'display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 84px; border-radius: 16px; cursor: pointer; font: inherit; ' + (on ? 'background: #AD5137; color: #FFFFFF; border: 1.5px solid #AD5137' : 'background: #FFFFFF; color: #75665D; border: 1.5px solid #EADFD6')
};
})
};
}
}
</script>
</body>
</html>
