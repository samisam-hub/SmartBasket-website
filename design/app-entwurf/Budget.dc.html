<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Budget und Unverträglichkeiten</title>
</head>
<body>
<x-dc>

<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 52px 24px 28px; display: flex; flex-direction: column; gap: 20px; background: #FFFCF8; color: #362B26; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: #AD5137">EINMAL EINRICHTEN</div>
<h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 700">Budget und Unverträglichkeiten</h1>
<p style="margin: 0; font-size: 16px; line-height: 24px; color: #75665D">Damit nur Gerichte vorgeschlagen werden, die zu euch passen.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 17px; font-weight: 600">Budget pro Woche</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{budgets}}" as="b" hint-placeholder-count="5">
<button onClick="{{b.pick}}" aria-pressed="{{b.pressed}}" style="{{b.style}}">{{b.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 17px; font-weight: 600">Was soll nicht auf den Tisch? <span style="font-size: 13px; font-weight: 400; color: #75665D">· mehrere möglich</span></span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{avoids}}" as="a" hint-placeholder-count="6">
<button onClick="{{a.toggle}}" aria-pressed="{{a.pressed}}" style="{{a.style}}">{{a.label}}</button>
</sc-for>
</div>
<span style="font-size: 14px; line-height: 20px; color: #75665D">{{avoidSummary}}</span>
</div>
<div style="flex-grow: 1"></div>
<p style="margin: 0; font-size: 13px; line-height: 18px; color: #75665D; text-align: center">Prüfe bei Allergien trotzdem immer die Angaben auf der Verpackung.</p>
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border: none; border-radius: 999px; background: #AD5137; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 600; text-decoration: none; cursor: pointer">Weiter</a>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

class Component extends DCLogic {
renderVals() {
const st = this.props.store, lib = this.props.lib, data = st.data;
const chip = on => 'min-height: 44px; padding: 0 16px; border-radius: 999px; font: inherit; font-size: 15px; cursor: pointer; ' + (on ? 'background: #362B26; color: #FFFFFF; border: 1.5px solid #362B26; font-weight: 600' : 'background: #FFFFFF; color: #362B26; border: 1.5px solid #EADFD6');
const av = data.avoids;
const names = lib.AVOIDS.filter(a => av.indexOf(a.id) >= 0).map(a => a.label);
return {
budgets: lib.BUDGETS.map(b => ({ label: b, pressed: data.budget === b ? 'true' : 'false', style: chip(data.budget === b), pick: () => st.set({ budget: b, generated: false }) })),
avoids: lib.AVOIDS.map(a => { const on = av.indexOf(a.id) >= 0;
return { label: (on ? '✕ ' : '') + a.label, pressed: on ? 'true' : 'false', style: chip(on),
toggle: () => st.set({ avoids: on ? av.filter(x => x !== a.id) : av.concat([a.id]), generated: false }) }; }),
avoidSummary: names.length ? 'Ohne ' + names.join(', ') + '. Passende Gerichte werden ausgefiltert.' : 'Keine Einschränkungen ausgewählt.'
};
}
}

</script>
</body>
</html>
