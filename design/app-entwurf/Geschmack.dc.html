<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Geschmack</title>
</head>
<body>
<x-dc>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 52px 24px 28px; display: flex; flex-direction: column; gap: 20px; background: #FFFCF8; color: #362B26; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif">
<sc-if value="{{overview}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: #AD5137">DEIN GESCHMACK</div>
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700">Was esst ihr gern?</h1>
<p style="margin: 0; font-size: 16px; line-height: 24px; color: #75665D">Wähle eine Mahlzeit und wische durch die Vorschläge. Jede Runde dauert nur ein paar Sekunden.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{slots}}" as="s" hint-placeholder-count="3">
<button onClick="{{s.open}}" aria-label="{{s.aria}}" style="{{s.style}}">
<span style="{{s.photo}}"><img src="{{s.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"></span>
<span style="display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; text-align: left">
<span style="font-size: 17px; font-weight: 600; color: #362B26">{{s.label}}</span>
<span style="font-size: 13px; color: #75665D">{{s.status}}</span>
</span>
<span style="{{s.badge}}">{{s.action}}</span>
</button>
</sc-for>
</div>
<div style="flex-grow: 1"></div>
<span style="font-size: 13px; line-height: 18px; color: #75665D; text-align: center">{{hint}}</span>
<button onClick="{{create}}" style="{{createStyle}}">Plan erstellen</button>
</sc-if>
<sc-if value="{{session}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: #AD5137">{{eyebrow}}</div>
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700">{{title}}</h1>
<div style="display: flex; gap: 4px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="5"><span style="{{b.style}}"></span></sc-for>
</div>
</div>
<sc-if value="{{hasCard}}" hint-placeholder-val="{{ true }}">
<div style="position: relative; display: flex; flex-direction: column; border-radius: 24px; overflow: hidden; background: #FFFFFF; border: 1.5px solid #EADFD6; box-shadow: 0 10px 24px -10px rgba(54,43,38,.25)">
<span style="position: relative; display: block; height: 300px; background: #F4D8BF">
<img src="{{card.img}}" alt="" style="{{card.imgStyle}}">
<sc-if value="{{card.noImg}}" hint-placeholder-val="{{ false }}"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#AD5137" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 50%; top: 50%; margin: -32px 0 0 -32px"><path d="M12 7c-1.5-1.2-4-1.4-5.6.2C4.6 9 5 13 6.6 16c1.2 2.2 2.8 3.8 4.4 3 .6-.3.9-.3 2 0 1.6.8 3.2-.8 4.4-3 1.6-3 2-7-.2-8.8C15.6 5.6 13.5 5.8 12 7z"></path><path d="M12 7c0-1.8.8-3.2 2.4-4"></path></svg></sc-if>
</span>
<span style="display: flex; flex-direction: column; gap: 4px; padding: 14px 16px 16px">
<span style="font-size: 20px; font-weight: 700">{{card.name}}</span>
<span style="font-size: 14px; color: #75665D">{{card.parts}}</span>
</span>
</div>
<div style="display: flex; justify-content: center; gap: 40px">
<button onClick="{{nope}}" aria-label="Mag ich nicht" style="display: flex; align-items: center; justify-content: center; width: 68px; height: 68px; border-radius: 999px; border: 2px solid #D9CCC2; background: #FFFFFF; color: #75665D; font: inherit; font-size: 26px; cursor: pointer">✕</button>
<button onClick="{{like}}" aria-label="Mag ich" style="display: flex; align-items: center; justify-content: center; width: 68px; height: 68px; border-radius: 999px; border: none; background: #AD5137; color: #FFFFFF; font: inherit; font-size: 28px; cursor: pointer">♥</button>
</div>
<button onClick="{{back}}" style="{{backStyle}}">↶ Zurück</button>
</sc-if>
<sc-if value="{{finished}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: 20px; background: #FFFFFF; border: 1.5px solid #EADFD6">
<span style="font-size: 17px; font-weight: 600">{{doneTitle}}</span>
<sc-for list="{{likedList}}" as="l" hint-placeholder-count="3">
<span style="display: flex; align-items: center; gap: 8px; font-size: 15px"><span style="color: #AD5137">♥</span>{{l.name}}</span>
</sc-for>
<button onClick="{{restart}}" style="align-self: flex-start; min-height: 40px; padding: 0; border: none; background: none; color: #AD5137; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Nochmal wischen</button>
</div>
</sc-if>
<div style="flex-grow: 1"></div>
<button onClick="{{next}}" style="{{nextStyle}}">{{nextLabel}}</button>
<button onClick="{{toOverview}}" style="display: flex; align-items: center; justify-content: center; min-height: 40px; border: none; background: none; color: #75665D; font: inherit; font-size: 14px; cursor: pointer">Zur Übersicht</button>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const st = this.props.store, lib = this.props.lib, data = st.data, prefs = data.prefs;
const slots = lib.mealsFor();
const PRIMARY = 'display: flex; align-items: center; justify-content: center; height: 56px; border: none; border-radius: 999px; background: #AD5137; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer';
const SUBTLE = 'display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #FFFFFF; color: #AD5137; border: 1.5px solid #AD5137; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer';
const info = s => { const c = lib.candidates(s.id); const rated = c.filter(id => prefs[id] !== undefined).length; const liked = c.filter(id => prefs[id] === true).length;
const first = c.map(id => lib.DISHES[id]).filter(x => x.img)[0]; return { c: c, rated: rated, liked: liked, done: c.length > 0 && rated >= c.length, img: first ? first.img : '' }; };
const create = () => { st.set({ plan: lib.generate(), generated: true, swipeSlot: null }); this.props.go('Wochenplan'); };
const active = slots.filter(s => s.id === data.swipeSlot)[0];
const allDone = slots.every(s => info(s).done);
if (!active) {
return {
overview: true, session: false,
slots: slots.map(s => { const i = info(s);
return { label: s.label, img: i.img, aria: s.label + ' wischen',
status: i.done ? i.liked + (i.liked === 1 ? ' Gericht' : ' Gerichte') + ' gemerkt' : i.rated ? i.rated + ' von ' + i.c.length + ' bewertet' : i.c.length + ' Vorschläge',
action: i.done ? '✓' : 'Wischen',
open: () => st.set({ swipeSlot: s.id, swipePos: i.done ? 0 : i.rated }),
style: 'display: flex; align-items: center; gap: 14px; padding: 10px 14px 10px 10px; border-radius: 18px; cursor: pointer; font: inherit; background: #FFFFFF; ' + (i.done ? 'border: 1.5px solid #AD5137' : 'border: 1.5px solid #EADFD6'),
photo: 'position: relative; display: block; width: 64px; height: 64px; flex-shrink: 0; overflow: hidden; border-radius: 14px; background: #F4D8BF',
badge: i.done ? 'display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex-shrink: 0; border-radius: 999px; background: #AD5137; color: #FFFFFF; font-size: 16px; font-weight: 700'
: 'flex-shrink: 0; padding: 8px 14px; border-radius: 999px; background: #FCEEDD; color: #AD5137; font-size: 14px; font-weight: 600' }; }),
hint: allDone ? 'Alles bewertet – jetzt den Plan erstellen.' : 'Du kannst auch ohne Wischen planen und später tauschen.',
create: create, createStyle: allDone ? PRIMARY : SUBTLE
};
}
const queue = lib.candidates(active.id);
const pos = Math.min(data.swipePos || 0, queue.length), cur = queue[pos];
const dish = cur ? lib.DISHES[cur] : null;
const rate = v => { const p = Object.assign({}, prefs); p[cur] = v; st.set({ prefs: p, swipePos: pos + 1, generated: false }); };
const liked = queue.filter(id => prefs[id] === true);
const nextSlot = slots.filter(s => s.id !== active.id && !info(s).done)[0];
return {
overview: false, session: true,
eyebrow: active.label.toUpperCase() + (cur ? ' · ' + (pos + 1) + ' VON ' + queue.length : ' · FERTIG'),
title: cur ? 'Was magst du?' : active.label + ' gespeichert',
bars: queue.map((id, i) => ({ style: 'flex: 1; height: 4px; border-radius: 999px; background: ' + (i < pos ? (prefs[id] ? '#AD5137' : '#D9CCC2') : i === pos ? '#E8B386' : '#EADFD6') })),
hasCard: !!cur, finished: !cur,
card: dish ? { name: dish.name, parts: dish.parts, img: dish.img || '', noImg: !dish.img,
imgStyle: 'position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: ' + (dish.img ? 'block' : 'none') } : {},
like: () => rate(true), nope: () => rate(false),
back: () => st.set({ swipePos: Math.max(0, pos - 1) }),
backStyle: 'align-self: center; min-height: 36px; border: none; background: none; color: #75665D; font: inherit; font-size: 14px; cursor: pointer; visibility: ' + (pos > 0 ? 'visible' : 'hidden'),
doneTitle: liked.length + (liked.length === 1 ? ' Gericht' : ' Gerichte') + ' gemerkt',
likedList: liked.map(id => ({ name: lib.DISHES[id].name })),
restart: () => st.set({ swipePos: 0 }),
next: cur ? () => st.set({ swipeSlot: null }) : nextSlot ? () => st.set({ swipeSlot: nextSlot.id, swipePos: 0 }) : create,
nextLabel: cur ? 'Später weiter wischen' : nextSlot ? 'Weiter mit ' + nextSlot.label : 'Plan erstellen',
nextStyle: cur ? 'display: none' : PRIMARY,
toOverview: () => st.set({ swipeSlot: null })
};
}
}
</script>
</body>
</html>
