<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">Von der Wochenplanung zur Nachfrage</title><desc id="d">Drei Schritte von Familienplanung über Packungsbedarf zu aggregierter Händlerübersicht.</desc><rect width="1200" height="430" rx="30" fill="#FFF3DE"/><g font-family="Arial,sans-serif"><text x="48" y="59" font-size="30" font-weight="700" fill="#123F2C">Von der Wochenplanung zur Nachfrage</text><text x="48" y="90" font-size="17" fill="#56675A">Konzeptioneller Datenfluss · keine Live-Integration</text></g><g fill="white" stroke="#B4D2B7" stroke-width="2"><rect x="45" y="130" width="320" height="245" rx="22"/><rect x="440" y="130" width="320" height="245" rx="22"/><rect x="835" y="130" width="320" height="245" rx="22"/></g><g font-family="Arial" fill="#075C35" font-weight="700"><text x="72" y="174" font-size="19">1 · Wochenplan</text><text x="467" y="174" font-size="19">2 · Packungsbedarf</text><text x="862" y="174" font-size="19">3 · Händlerübersicht</text></g><g font-family="Arial" font-size="17" fill="#34473A"><text x="72" y="223">Familien wählen Rezepte</text><text x="72" y="252">und planen Mahlzeiten.</text><text x="467" y="223">Zutaten werden in</text><text x="467" y="252">ganze Packungen übersetzt.</text><text x="862" y="223">Bedarf wird aggregiert</text><text x="862" y="252">und als Demo visualisiert.</text></g><g fill="#CDEBAF"><rect x="72" y="283" width="264" height="56" rx="12"/><rect x="467" y="283" width="264" height="56" rx="12"/><rect x="862" y="283" width="264" height="56" rx="12"/></g><g font-family="Arial" font-size="17" font-weight="700" fill="#075C35"><text x="90" y="317">Rezepte + Portionen</text><text x="485" y="317">Artikel + Mengen</text><text x="880" y="317">Warengruppen + Trends</text></g><g stroke="#075C35" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M380 252h42m-12 -12 12 12 -12 12"/><path d="M775 252h42m-12 -12 12 12 -12 12"/></g></svg>